name: Build & Release TicTacToe

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            icon: assets/ticTacX.ico

          - os: ubuntu-latest
            platform: linux
            icon: assets/ticTacX.png

          - os: macos-latest
            platform: macos
            icon: assets/ticTacX.icns

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify expected project layout
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Main.java || {
            echo "::error::src/Main.java not found"
            exit 1
          }

          test -f lib/flatlaf-3.7.1.jar || {
            echo "::error::lib/flatlaf-3.7.1.jar not found"
            exit 1
          }

          test -d assets || {
            echo "::error::assets/ directory not found"
            exit 1
          }

      - name: Compile sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out
          find src -name "*.java" > sources.txt

          javac \
            -g:none \
            -d out \
            -cp "lib/*" \
            @sources.txt

      - name: Determine main class
        shell: bash
        run: |
          set -euo pipefail

          MAIN_CLASS_FILE=$(find out -name "Main.class" | head -n1)

          if [ -z "$MAIN_CLASS_FILE" ]; then
            echo "::error::Main.class not found anywhere under out/ after compilation — check that src/Main.java compiled successfully"
            exit 1
          fi

          RELATIVE_PATH=${MAIN_CLASS_FILE#out/}
          MAIN_CLASS=$(echo "$RELATIVE_PATH" | sed 's/\.class$//' | tr '/' '.')

          echo "Resolved Main-Class: $MAIN_CLASS (from $MAIN_CLASS_FILE)"
          echo "MAIN_CLASS=$MAIN_CLASS" >> "$GITHUB_ENV"

      - name: Determine required JDK modules
        shell: bash
        run: |
          set -euo pipefail

          set +e

          jdeps \
            --print-module-deps \
            --multi-release 21 \
            --class-path "lib/*" \
            -R out \
            > modules.txt \
            2> jdeps-warnings.log

          JDEPS_EXIT=$?

          set -e

          cat jdeps-warnings.log || true

          MODULES=""

          if [ "$JDEPS_EXIT" -eq 0 ]; then
            CANDIDATE=$(tr -d '[:space:]' < modules.txt)

            if echo "$CANDIDATE" | grep -Eq '^[a-z0-9.]+(,[a-z0-9.]+)*$'; then
              MODULES="$CANDIDATE"
            fi
          fi

          if [ -z "$MODULES" ]; then
            echo "jdeps did not produce a usable module list, using fallback"
            MODULES="java.base,java.desktop,java.logging,java.prefs"
          fi

          case ",$MODULES," in
            *,java.desktop,*) ;;
            *) MODULES="$MODULES,java.desktop" ;;
          esac

          case ",$MODULES," in
            *,java.prefs,*) ;;
            *) MODULES="$MODULES,java.prefs" ;;
          esac

          case ",$MODULES," in
            *,java.logging,*) ;;
            *) MODULES="$MODULES,java.logging" ;;
          esac

          echo "Resolved modules: $MODULES"
          echo "$MODULES" > modules.txt

      - name: Copy resources into out
        shell: bash
        run: |
          set -euo pipefail

          cp -r assets out/assets
          cp lib/*.jar out/

      - name: Build fat JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cd out

          for jar in *.jar; do
            jar xf "$jar"
            rm -f "$jar"
          done

          printf 'Manifest-Version: 1.0\nMain-Class: %s\n' "$MAIN_CLASS" > MANIFEST.MF

          jar \
            --create \
            --file ../dist/tictactoe.jar \
            --manifest MANIFEST.MF \
            .

          rm -f MANIFEST.MF

          cd ..

          EXPECTED_PATH="$(echo "$MAIN_CLASS" | tr '.' '/').class"

          jar tf dist/tictactoe.jar | grep -x "$EXPECTED_PATH" || {
            echo "::error::$EXPECTED_PATH not found in built jar — check package declarations"
            exit 1
          }

      - name: Build minimal custom runtime
        shell: bash
        run: |
          set -euo pipefail

          MODULES=$(cat modules.txt)

          jlink \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output custom-runtime

      - name: Run jpackage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p appimage

          jpackage \
            --type app-image \
            --name tictactoe \
            --input dist \
            --main-jar tictactoe.jar \
            --main-class "$MAIN_CLASS" \
            --icon "${{ matrix.icon }}" \
            --runtime-image custom-runtime \
            --dest appimage \
            --java-options "-Xlog:exceptions=info:file=crash.log:uptime,level,tags"

      - name: Smoke test launcher (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y xvfb

          cd appimage/tictactoe

          rm -f crash.log

          xvfb-run -a ./bin/tictactoe > run.log 2>&1 &
          PID=$!

          sleep 4

          ALIVE=true

          kill -0 "$PID" 2>/dev/null || ALIVE=false

          kill "$PID" 2>/dev/null || true

          sleep 1

          echo "----- stdout/stderr -----"
          cat run.log || true

          if [ -f crash.log ]; then
            echo "----- crash.log -----"
            cat crash.log
          fi

          if [ "$ALIVE" = false ]; then
            echo "::error::App exited within 4s of launch — likely a startup crash (missing FlatLaf class, bad icon resource, or broken runtime image)."
            exit 1
          fi

          if grep -qE "Exception in thread|Caused by:" run.log; then
            echo "::error::App logged an uncaught exception during startup — see log above."
            exit 1
          fi

          echo "Smoke test passed: launcher started, stayed alive 4s, no uncaught exceptions."

      - name: Smoke test launcher (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          cd appimage/tictactoe.app/Contents/MacOS

          rm -f crash.log

          ./tictactoe > /tmp/run.log 2>&1 &
          PID=$!

          sleep 4

          ALIVE=true

          kill -0 "$PID" 2>/dev/null || ALIVE=false

          kill "$PID" 2>/dev/null || true

          sleep 1

          echo "----- stdout/stderr -----"
          cat /tmp/run.log || true

          if [ -f crash.log ]; then
            echo "----- crash.log -----"
            cat crash.log
          fi

          if [ "$ALIVE" = false ]; then
            echo "::error::App exited within 4s of launch — likely a startup crash (missing FlatLaf class, bad icon resource, or broken runtime image)."
            exit 1
          fi

          if grep -qE "Exception in thread|Caused by:" /tmp/run.log; then
            echo "::error::App logged an uncaught exception during startup — see log above."
            exit 1
          fi

          echo "Smoke test passed: launcher started, stayed alive 4s, no uncaught exceptions."

      - name: Report bundle size
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.platform }}" in
            windows)
              TARGET="appimage/tictactoe"
              ;;

            linux)
              TARGET="appimage/tictactoe"
              ;;

            macos)
              TARGET="appimage/tictactoe.app"
              ;;
          esac

          SIZE=$(du -sh "$TARGET" | cut -f1)

          echo "### 📦 ${{ matrix.platform }} bundle size: $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail

          cd appimage

          powershell -Command "Compress-Archive -Path tictactoe -DestinationPath ../tictactoe-windows.zip"

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cd appimage

          tar -czf ../tictactoe-linux.tar.gz tictactoe

      - name: Package artifact (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          cd appimage

          zip -r ../tictactoe-macos.zip tictactoe.app

      - name: Upload to release (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: tictactoe-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (Linux)
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: tictactoe-linux.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (macOS)
        if: matrix.platform == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: tictactoe-macos.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}